@if (isAdminRoute() && token && !loadNothing) {
  <div class="cr-admin-shell">
    <app-admin-sidebar class="cr-admin-shell__sidebar" />
    <div class="cr-admin-shell__main">
      <app-admin-navbar />
      <div class="cr-admin-shell__content">
        <router-outlet />
      </div>
      <app-admin-footer />
    </div>
  </div>
} @else if (!loadNothing) {
  <app-navbar />
  <main>
    <router-outlet />
  </main>
  <app-footer />
} @else {
  <main>
    <router-outlet />
  </main>
}
